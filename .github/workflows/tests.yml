name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Lancer la suite de tests
        run: pytest -v
        # DATABASE_URL n'est pas configuree ici : les tests d'integration
        # base de donnees (tests/test_db.py) sont ignores automatiquement
        # (voir skipif), le reste de la suite s'execute normalement.
